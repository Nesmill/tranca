<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Canary — WebGL portrait check</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #label {
        position: fixed; left: 0; right: 0; top: 14px; text-align: center;
        font: 700 20px/1.2 system-ui, sans-serif; color: #eaf2ff;
        text-shadow: 0 1px 3px #000; pointer-events: none;
      }
      #dbg {
        position: fixed; left: 0; right: 0; bottom: 0; max-height: 45%; overflow: auto;
        margin: 0; padding: 10px 12px; white-space: pre-wrap;
        font: 12px/1.45 ui-monospace, Consolas, monospace;
        color: #ff8a8a; background: rgba(0, 0, 0, 0.78);
      }
      #dbg:empty { display: none; }
      /* Proportion probes: a true circle and a true square. If the captured PNG
         shows an ellipse or a rectangle, the window is not matching the viewport. */
      #circle {
        position: fixed; left: 50%; top: 50%; width: 140px; height: 140px;
        margin: -70px 0 0 -70px; border: 3px solid #ffd34d; border-radius: 50%;
        pointer-events: none;
      }
      #square {
        position: fixed; left: 16px; top: 60px; width: 90px; height: 90px;
        border: 3px solid #6ef08a; pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "three/addons/": "./lib/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="circle"></div>
    <div id="square"></div>
    <div id="label">CANARY OK</div>
    <pre id="dbg"></pre>

    <script>
      // Error trap first: anything below reports here instead of vanishing.
      const dbg = document.getElementById('dbg');
      const report = (tag) => (e) => {
        dbg.textContent += `[${tag}] ${e?.message ?? e}\n${e?.stack ?? ''}\n`;
      };
      window.addEventListener('error', report('error'));
      window.addEventListener('unhandledrejection', report('rejection'));
    </script>

    <script type="module">
      import * as THREE from 'three';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x24405e);
      const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
      camera.position.set(0, 0.6, 3);
      camera.lookAt(0, 0.6, 0);

      scene.add(new THREE.HemisphereLight(0xdfefff, 0x223044, 2.2));
      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(2, 4, 3);
      scene.add(key);

      // Blue plastic slab: reads as the colmado table colour at a glance.
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(1.7, 0.14, 2.4),
        new THREE.MeshStandardMaterial({ color: 0x2f6fb5, roughness: 0.45, metalness: 0.02 }),
      );
      slab.position.y = 0.0;
      scene.add(slab);

      // Bone tile: must stay clearly brighter than the slab.
      const tile = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.16, 0.68),
        new THREE.MeshStandardMaterial({ color: 0xf2ece0, roughness: 0.7 }),
      );
      tile.position.set(0, 0.5, 0.2);
      scene.add(tile);

      function resize() {
        const w = canvas.clientWidth || innerWidth;
        const h = canvas.clientHeight || innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      addEventListener('resize', resize);
      resize();

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();
        tile.rotation.y = t * 1.6;
        tile.position.y = 0.5 + Math.sin(t * 2.4) * 0.12;
        renderer.render(scene, camera);
      });

      // Proof for the capture harness: the page reports its own frame size.
      dbg.textContent = '';
      document.getElementById('label').textContent =
        `OK ${innerWidth}x${innerHeight}@${devicePixelRatio} ` +
        `canvas ${canvas.width}x${canvas.height} r${THREE.REVISION}`;
    </script>
  </body>
</html>
