<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Harness — Repite y Tranca</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b09; }
      #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #debug {
        position: fixed; left: 0; bottom: 0; margin: 0; padding: 8px 10px;
        white-space: pre-wrap; mix-blend-mode: difference;
        font: 11px/1.45 ui-monospace, Consolas, monospace;
        color: #9df0b6; background: rgba(0, 0, 0, 0.74); pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/three.module.js",
          "three/addons/": "./lib/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"></div>
    <pre id="debug"></pre>

    <script>
      window.__errors = [];
      const record = (tag) => (e) => {
        window.__errors.push(`[${tag}] ${e?.message ?? e}`);
        const el = document.getElementById('debug');
        el.style.display = 'block';
        el.textContent += `\n[${tag}] ${e?.message ?? e}\n${e?.stack ?? ''}`;
      };
      window.addEventListener('error', record('error'));
      window.addEventListener('unhandledrejection', (e) => record('rejection')(e.reason));
    </script>

    <script type="module">
      // Generic per-feature harness: ?module=name[,name2]
      // A missing module boots cleanly and reports itself in #debug.
      import { createEngine } from './src/core/engine.js';

      const names = (new URLSearchParams(location.search).get('module') ?? '')
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean);

      const engine = createEngine({
        canvas: document.getElementById('stage'),
        debugEl: document.getElementById('debug'),
        hudEl: document.getElementById('hud'),
      });

      for (const name of names) {
        try {
          const mod = (await import(`./src/features/${name}.js`)).default;
          engine.register(mod);
        } catch (err) {
          document.getElementById('debug').style.display = 'block';
          document.getElementById('debug').textContent +=
            `\n[harness] could not load feature "${name}": ${err?.message ?? err}`;
        }
      }

      engine.ctx.log(`harness modules: ${names.join(', ') || '(none)'}`);
      engine.start();
      window.engine = engine;
    </script>
  </body>
</html>
